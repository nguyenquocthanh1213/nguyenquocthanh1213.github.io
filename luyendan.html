
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tối Ưu Tọa Độ XYZ</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --input-bg: #f9fafb;
        }

        [data-theme="dark"] {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --primary: #3b82f6;
            --input-bg: #374151;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 { font-size: 1.8rem; font-weight: 600; }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-theme {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .btn-theme:hover { transform: scale(1.1); }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1.5fr auto;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--input-bg);
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--primary); }

        .btn-add { background-color: var(--success); color: white; margin-bottom: 1rem; width: 100%; }
        .btn-add:hover { opacity: 0.9; }
        
        .btn-remove { background-color: transparent; color: var(--danger); font-size: 1.2rem; padding: 0.2rem 0.5rem; }
        .btn-remove:hover { color: var(--danger-hover); transform: scale(1.1); }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-calc { background-color: var(--primary); color: white; flex: 1; font-size: 1.1rem; padding: 0.8rem; }
        .btn-calc:hover { background-color: var(--primary-hover); }

        .btn-reset { background-color: var(--danger); color: white; }
        .btn-reset:hover { background-color: var(--danger-hover); }

        .result-box {
            display: none;
            text-align: center;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .history-list { list-style: none; }
        .history-item {
            background-color: var(--input-bg);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.8rem;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item .details { font-size: 0.9rem; color: var(--text-muted); }
        .history-item .result { font-weight: bold; color: var(--primary); font-size: 1.1rem; }

        /* Tiêu đề cột */
        .col-headers {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1.5fr auto;
            gap: 10px;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎯 Tối Ưu Hóa Tọa Độ</h1>
        <button class="btn-theme" id="themeToggle" onclick="toggleTheme()">🌙</button>
    </header>

    <div class="card">
        <h2 style="font-size: 1.2rem; margin-bottom: 1rem;">Nhập dữ liệu</h2>
        <div class="col-headers">
            <div>X</div>
            <div>Y</div>
            <div>Z</div>
            <div>Sai lệch</div>
            <div style="width: 30px;"></div>
        </div>
        
        <div id="dataContainer"></div>
        
        <button class="btn-add" onclick="addRow()">+ Thêm dòng dữ liệu</button>

        <div class="actions">
            <button class="btn-reset" onclick="resetAll()">🔄 Reset</button>
            <button class="btn-calc" id="calcBtn" onclick="calculate()">🚀 Tính Toán</button>
        </div>

        <div class="result-box" id="resultBox"></div>
    </div>

    <div class="card">
        <h2 style="font-size: 1.2rem; margin-bottom: 1rem;">📜 Lịch sử tìm kiếm</h2>
        <ul class="history-list" id="historyList">
            <!-- Lịch sử sẽ hiện ở đây -->
        </ul>
    </div>
</div>

<script>
    // --- KHỞI TẠO ---
    const dataContainer = document.getElementById('dataContainer');
    let historyData = JSON.parse(localStorage.getItem('xyz_history')) || [];

    // Theme Load
    if (localStorage.getItem('xyz_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('themeToggle').innerText = '☀️';
    }

    function toggleTheme() {
        const root = document.documentElement;
        if (root.getAttribute('data-theme') === 'dark') {
            root.removeAttribute('data-theme');
            localStorage.setItem('xyz_theme', 'light');
            document.getElementById('themeToggle').innerText = '🌙';
        } else {
            root.setAttribute('data-theme', 'dark');
            localStorage.setItem('xyz_theme', 'dark');
            document.getElementById('themeToggle').innerText = '☀️';
        }
    }

    // --- XỬ LÝ GIAO DIỆN ---
    function addRow(x = '', y = '', z = '', err = '') {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
            <input type="number" step="any" placeholder="0" value="${x}">
            <input type="number" step="any" placeholder="0" value="${y}">
            <input type="number" step="any" placeholder="0" value="${z}">
            <input type="number" step="any" placeholder="0.0" value="${err}">
            <button class="btn-remove" onclick="this.parentElement.remove()" title="Xóa">✖</button>
        `;
        dataContainer.appendChild(row);
    }

    function resetAll() {
        dataContainer.innerHTML = '';
        document.getElementById('resultBox').style.display = 'none';
        addRow(); // Thêm 1 dòng trống mặc định
    }

    // --- THUẬT TOÁN VÉT CẠN TỐI ƯU ---
    function gcd(a, b) {
        while (b !== 0) {
            let temp = b;
            b = a % b;
            a = temp;
        }
        return a;
    }

    function gcd3(a, b, c) {
        return gcd(a, gcd(b, c));
    }

    function calcLoss(data, tx, ty, tz) {
        let sum_DE = 0.0, sum_D2 = 0.0;
        let n = data.length;
        let dis = new Float64Array(n);
        
        for (let i = 0; i < n; ++i) {
            let dx = data[i].px - tx, dy = data[i].py - ty, dz = data[i].pz - tz;
            dis[i] = Math.sqrt(dx*dx + dy*dy + dz*dz);
            sum_DE += dis[i] * data[i].err;
            sum_D2 += dis[i] * dis[i];
        }
        if (sum_D2 === 0) return 0.0;
        
        let best_k = sum_DE / sum_D2;
        let loss = 0.0;
        for (let i = 0; i < n; ++i) {
            let diff = data[i].err - (best_k * dis[i]);
            loss += diff * diff;
        }
        return loss;
    }

    function calculate() {
        const rows = document.querySelectorAll('.row');
        let records = [];

        // Thu thập dữ liệu
        rows.forEach(row => {
            const inputs = row.querySelectorAll('input');
            let x = parseFloat(inputs[0].value) || 0;
            let y = parseFloat(inputs[1].value) || 0;
            let z = parseFloat(inputs[2].value) || 0;
            let err = parseFloat(inputs[3].value) || 0;
            
            let total = x + y + z;
            if (total > 0) {
                records.push({ px: x/total, py: y/total, pz: z/total, err: err });
            }
        });

        if (records.length === 0) {
            alert('Vui lòng nhập ít nhất 1 dòng dữ liệu hợp lệ (Tổng X+Y+Z > 0)!');
            return;
        }

        const btn = document.getElementById('calcBtn');
        btn.innerText = '⏳ Đang tính toán...';
        btn.disabled = true;

        // Cho phép UI render trạng thái loading trước khi vòng lặp khóa luồng chính
        setTimeout(() => {
            let min_loss = Infinity;
            let final_x = 0, final_y = 0, final_z = 0;

            // Vòng lặp quét UCLN < 200 (Khoảng vài trăm nghìn bước - JS chạy mất ~0.1s)
            for (let x = 0; x <= 200; ++x) {
                for (let y = 0; y <= 200; ++y) {
                    for (let z = 0; z <= 200; ++z) {
                        if (x === 0 && y === 0 && z === 0) continue;
                        if (gcd3(x, y, z) !== 1) continue;

                        let sum = x + y + z;
                        let loss = calcLoss(records, x/sum, y/sum, z/sum);

                        if (loss < min_loss) {
                            min_loss = loss;
                            final_x = x;
                            final_y = y;
                            final_z = z;
                        }
                    }
                }
            }

            // Hiển thị kết quả
            const resultBox = document.getElementById('resultBox');
            const resStr = `X = ${final_x} &nbsp;|&nbsp; Y = ${final_y} &nbsp;|&nbsp; Z = ${final_z}`;
            resultBox.innerHTML = `🎉 KẾT QUẢ TỐI ƯU 🎉<br>${resStr}`;
            resultBox.style.display = 'block';

            // Lưu lịch sử
            saveHistory(records.length, final_x, final_y, final_z);

            // Khôi phục nút
            btn.innerText = '🚀 Tính Toán';
            btn.disabled = false;
        }, 50);
    }

    // --- LỊCH SỬ ---
    function saveHistory(n, x, y, z) {
        const time = new Date().toLocaleTimeString('vi-VN');
        const newItem = { time, n, x, y, z };
        historyData.unshift(newItem); // Thêm lên đầu
        if (historyData.length > 5) historyData.pop(); // Giữ tối đa 5 lịch sử
        
        localStorage.setItem('xyz_history', JSON.stringify(historyData));
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        if (historyData.length === 0) {
            list.innerHTML = '<li class="history-item"><div class="details">Chưa có lịch sử tính toán.</div></li>';
            return;
        }
        
        list.innerHTML = historyData.map(item => `
            <li class="history-item">
                <div class="details">
                    🕒 ${item.time} <br>
                    📊 Dữ liệu: ${item.n} dòng
                </div>
                <div class="result">
                    X=${item.x}, Y=${item.y}, Z=${item.z}
                </div>
            </li>
        `).join('');
    }

    // Khởi tạo ban đầu
    addRow();
    renderHistory();
</script>

</body>
</html>
